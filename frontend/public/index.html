<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multimodal AI Personal Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151e2e',
              950: '#070b14'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for seamless in-browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- API CLIENT ---
    const API = {
      async health() {
        try {
          const res = await fetch('/health');
          return await res.json();
        } catch(e) {
          return { status: 'offline', llm_provider: 'mock', search_engine: 'duckduckgo' };
        }
      },
      async listConversations() {
        const res = await fetch('/api/conversations');
        return await res.json();
      },
      async createConversation(title = 'New Conversation') {
        const res = await fetch('/api/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        return await res.json();
      },
      async getConversation(id) {
        const res = await fetch(`/api/conversations/${id}`);
        return await res.json();
      },
      async deleteConversation(id) {
        const res = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
        return await res.json();
      },
      async uploadFile(file, conversationId) {
        const fd = new FormData();
        fd.append('file', file);
        if (conversationId) fd.append('conversation_id', conversationId);
        const res = await fetch('/api/files/upload', { method: 'POST', body: fd });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Upload error' }));
          throw new Error(err.detail || 'Upload failed');
        }
        return await res.json();
      },
      async createDocument(title, instructions, conversationId) {
        const res = await fetch('/api/documents/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, instructions, conversation_id: conversationId, file_format: 'docx' })
        });
        return await res.json();
      },
      async updateDocument(documentId, instructions, conversationId) {
        const res = await fetch(`/api/documents/${documentId}/update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ instructions, conversation_id: conversationId })
        });
        return await res.json();
      },
      async chat(payload) {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: 'Request failed' }));
          throw new Error(err.detail || 'Assistant request failed');
        }
        return await res.json();
      }
    };

    // --- FORMATTED MARKDOWN & IMAGE RENDERER ---
    function FormattedContent({ content }) {
      if (!content) return null;

      // Extract image markdown: ![alt](url)
      const imageRegex = /!\[(.*?)\]\((.*?)\)/g;
      const parts = [];
      let lastIndex = 0;
      let match;

      while ((match = imageRegex.exec(content)) !== null) {
        if (match.index > lastIndex) {
          parts.push({ type: 'text', text: content.substring(lastIndex, match.index) });
        }
        parts.push({ type: 'image', alt: match[1], url: match[2] });
        lastIndex = match.index + match[0].length;
      }
      if (lastIndex < content.length) {
        parts.push({ type: 'text', text: content.substring(lastIndex) });
      }

      const renderTextFormatted = (text) => {
        // Split by lines
        return text.split('\n').map((line, lIdx) => {
          if (!line.trim()) return <div key={lIdx} className="h-2" />;

          // Heading 3
          if (line.startsWith('### ')) {
            return <h4 key={lIdx} className="text-sm font-bold text-white mt-2 mb-1">{line.replace('### ', '')}</h4>;
          }
          // Heading 2
          if (line.startsWith('## ')) {
            return <h3 key={lIdx} className="text-base font-bold text-indigo-300 mt-2.5 mb-1.5">{line.replace('## ', '')}</h3>;
          }
          // Bullet point
          if (line.startsWith('- ') || line.startsWith('* ')) {
            return (
              <div key={lIdx} className="flex items-start gap-2 my-0.5 ml-1">
                <span className="text-indigo-400 mt-1">•</span>
                <span className="flex-1">{parseInline(line.substring(2))}</span>
              </div>
            );
          }
          return <p key={lIdx} className="my-1 leading-relaxed">{parseInline(line)}</p>;
        });
      };

      const parseInline = (str) => {
        // Parse bold and links
        const linkRegex = /\[(.*?)\]\((.*?)\)/g;
        const subParts = [];
        let lIdx = 0;
        let lMatch;

        while ((lMatch = linkRegex.exec(str)) !== null) {
          if (lMatch.index > lIdx) {
            subParts.push(parseBold(str.substring(lIdx, lMatch.index)));
          }
          subParts.push(
            <a key={lMatch.index} href={lMatch[2]} target="_blank" rel="noreferrer" className="text-indigo-400 hover:underline font-medium">
              {lMatch[1]}
            </a>
          );
          lIdx = lMatch.index + lMatch[0].length;
        }
        if (lIdx < str.length) {
          subParts.push(parseBold(str.substring(lIdx)));
        }
        return subParts;
      };

      const parseBold = (str) => {
        const boldParts = str.split(/(\*\*.*?\*\*)/g);
        return boldParts.map((bp, i) => {
          if (bp.startsWith('**') && bp.endsWith('**')) {
            return <strong key={i} className="font-semibold text-white">{bp.slice(2, -2)}</strong>;
          }
          return bp;
        });
      };

      return (
        <div className="text-sm leading-relaxed break-words font-sans">
          {parts.map((p, idx) => {
            if (p.type === 'image') {
              return (
                <div key={idx} className="my-3 rounded-2xl overflow-hidden border border-slate-700 bg-slate-950 shadow-xl max-w-lg">
                  <img
                    src={p.url}
                    alt={p.alt || 'AI Result'}
                    className="w-full h-auto object-cover max-h-[420px] hover:scale-[1.01] transition duration-300"
                    loading="lazy"
                    onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800'; }}
                  />
                  <div className="p-2.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between">
                    <span className="text-xs text-slate-300 truncate font-medium">{p.alt || 'Image Preview'}</span>
                    <a
                      href={p.url}
                      download
                      target="_blank"
                      rel="noreferrer"
                      className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-medium rounded-lg transition shadow"
                    >
                      ⬇️ Open / Download
                    </a>
                  </div>
                </div>
              );
            }
            return <div key={idx}>{renderTextFormatted(p.text)}</div>;
          })}
        </div>
      );
    }

    // --- APP COMPONENT ---
    function App() {
      const [conversations, setConversations] = useState([]);
      const [activeConvId, setActiveConvId] = useState(null);
      const [messages, setMessages] = useState([]);
      const [documents, setDocuments] = useState([]);
      const [attachedFiles, setAttachedFiles] = useState([]);
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [health, setHealth] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [docModalOpen, setDocModalOpen] = useState(false);
      const [webSearchOn, setWebSearchOn] = useState(false);
      const [ragOn, setRagOn] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [speaking, setSpeaking] = useState(false);

      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const textareaRef = useRef(null);

      useEffect(() => {
        API.health().then(setHealth);
        loadConvs();
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading]);

      const loadConvs = async () => {
        try {
          const list = await API.listConversations();
          setConversations(list);
          if (list.length > 0 && !activeConvId) {
            selectConv(list[0].id);
          }
        } catch (e) {
          console.error(e);
        }
      };

      const selectConv = async (id) => {
        setActiveConvId(id);
        setAttachedFiles([]);
        try {
          const detail = await API.getConversation(id);
          setMessages(detail.messages || []);
          setDocuments(detail.documents || []);
        } catch (e) {
          console.error(e);
        }
      };

      const handleNewChat = async () => {
        try {
          const conv = await API.createConversation('New Conversation');
          setConversations([conv, ...conversations]);
          setActiveConvId(conv.id);
          setMessages([]);
          setDocuments([]);
          setAttachedFiles([]);
          setSidebarOpen(false);
        } catch (e) {
          console.error(e);
        }
      };

      const handleDeleteChat = async (id, e) => {
        e.stopPropagation();
        try {
          await API.deleteConversation(id);
          const rest = conversations.filter(c => c.id !== id);
          setConversations(rest);
          if (activeConvId === id) {
            if (rest.length > 0) selectConv(rest[0].id);
            else {
              setActiveConvId(null);
              setMessages([]);
              setDocuments([]);
            }
          }
        } catch (e) {
          console.error(e);
        }
      };

      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        for (const f of files) {
          try {
            let previewUrl = null;
            if (f.type.startsWith('image/')) previewUrl = URL.createObjectURL(f);
            const doc = await API.uploadFile(f, activeConvId);
            setAttachedFiles(prev => [...prev, { file: f, id: doc.id, name: doc.filename, previewUrl }]);
            setDocuments(prev => [doc, ...prev]);
          } catch (err) {
            alert(err.message);
          }
        }
        e.target.value = '';
      };

      const handleSendMessage = async (textToSend) => {
        const msg = textToSend !== undefined ? textToSend : inputText;
        if ((!msg.trim() && attachedFiles.length === 0) || isLoading) return;

        const fileIds = attachedFiles.map(f => f.id);
        const tempUserMsg = {
          id: `u-${Date.now()}`,
          role: 'user',
          content: msg,
          created_at: new Date().toISOString()
        };

        setMessages(prev => [...prev, tempUserMsg]);
        setInputText('');
        setAttachedFiles([]);
        setIsLoading(true);

        try {
          const res = await API.chat({
            message: msg,
            conversation_id: activeConvId,
            attached_file_ids: fileIds,
            enable_web_search: webSearchOn ? true : null,
            enable_rag: ragOn ? true : null
          });

          if (!activeConvId && res.conversation_id) {
            setActiveConvId(res.conversation_id);
          }

          const asstMsg = {
            id: `a-${Date.now()}`,
            role: 'assistant',
            content: res.response,
            created_at: new Date().toISOString(),
            metadata: {
              query_type: res.query_type,
              sources: res.sources,
              created_document: res.created_document
            }
          };

          setMessages(prev => [...prev, asstMsg]);
          loadConvs();
        } catch (err) {
          setMessages(prev => [
            ...prev,
            {
              id: `err-${Date.now()}`,
              role: 'assistant',
              content: `⚠️ **Error Processing Request:** ${err.message}`,
              created_at: new Date().toISOString(),
              metadata: { query_type: 'general' }
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      const toggleSTT = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return alert('Speech recognition not supported in this browser. Use Chrome/Edge.');
        if (isListening) { setIsListening(false); return; }

        try {
          const rec = new SR();
          rec.lang = 'en-US';
          rec.onstart = () => setIsListening(true);
          rec.onend = () => setIsListening(false);
          rec.onerror = () => setIsListening(false);
          rec.onresult = (evt) => {
            const transcript = evt.results[0][0].transcript;
            setInputText(prev => prev ? `${prev} ${transcript}` : transcript);
          };
          rec.start();
        } catch(e) { setIsListening(false); }
      };

      const handleTTS = (text) => {
        if (!('speechSynthesis' in window)) return alert('TTS not supported in browser.');
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          setSpeaking(false);
          return;
        }
        const clean = text.replace(/[#*`_\[\]()>-]/g, '').trim();
        const utt = new SpeechSynthesisUtterance(clean);
        utt.onend = () => setSpeaking(false);
        utt.onerror = () => setSpeaking(false);
        setSpeaking(true);
        window.speechSynthesis.speak(utt);
      };

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 font-sans">
          {/* Mobile Overlay */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm lg:hidden" onClick={() => setSidebarOpen(false)} />
          )}

          {/* Sidebar */}
          <aside className={`fixed top-0 bottom-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 flex flex-col transition-transform lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">
                  ✨
                </div>
                <div>
                  <h1 className="font-semibold text-sm leading-tight text-white">Multimodal AI</h1>
                  <p className="text-[11px] text-slate-400">Personal Assistant</p>
                </div>
              </div>
              <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-slate-400 hover:text-white p-1">✕</button>
            </div>

            <div className="p-3 space-y-2">
              <button onClick={handleNewChat} className="w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition shadow-sm active:scale-95">
                ➕ New Conversation
              </button>
              <button onClick={() => setDocModalOpen(true)} className="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium border border-slate-700 transition">
                📄 Document Tools
              </button>
            </div>

            <div className="flex-1 overflow-y-auto px-3 py-2 space-y-1">
              <div className="text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-2 py-1">Conversations</div>
              {conversations.length === 0 ? (
                <div className="px-3 py-6 text-center text-xs text-slate-500">No chats yet.<br/>Start a conversation!</div>
              ) : (
                conversations.map(c => (
                  <div key={c.id} onClick={() => selectConv(c.id)} className={`group flex items-center justify-between rounded-xl px-3 py-2 text-xs cursor-pointer transition ${c.id === activeConvId ? 'bg-slate-800 text-white font-medium border border-slate-700' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}>
                    <div className="flex items-center gap-2 truncate pr-4">
                      <span>💬</span>
                      <span className="truncate">{c.title || 'Chat'}</span>
                    </div>
                    <button onClick={(e) => handleDeleteChat(c.id, e)} className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 p-1">🗑️</button>
                  </div>
                ))
              )}
            </div>

            <div className="p-3 border-t border-slate-800 bg-slate-950 text-xs text-slate-400 space-y-1">
              <div className="flex items-center justify-between">
                <span className="flex items-center gap-1.5 text-[11px]">
                  <span className={`w-2 h-2 rounded-full ${health?.status === 'healthy' ? 'bg-emerald-400' : 'bg-amber-400'}`} />
                  System Status
                </span>
                <span className="text-[10px] font-mono uppercase bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">{health?.status || 'checking...'}</span>
              </div>
              <div className="text-[10px] text-slate-500 flex justify-between">
                <span>LLM: {health?.llm_provider || 'gemini'}</span>
                <span>Search: {health?.search_engine || 'duckduckgo'}</span>
              </div>
            </div>
          </aside>

          {/* Main Chat Content */}
          <main className="flex-1 flex flex-col h-full lg:pl-72 relative">
            <header className="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 flex items-center justify-between z-20">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarOpen(true)} className="lg:hidden p-2 rounded-lg text-slate-400 hover:text-white">☰</button>
                <div className="font-semibold text-sm text-slate-200 truncate">
                  {conversations.find(c => c.id === activeConvId)?.title || 'Multimodal AI Assistant'}
                </div>
              </div>
              <button onClick={() => setDocModalOpen(true)} className="px-3 py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/40 text-indigo-300 hover:bg-indigo-600/30 text-xs font-medium transition">
                📄 Create / Edit Doc
              </button>
            </header>

            {/* Message Stream */}
            <div className="flex-1 overflow-y-auto px-4 py-6 md:px-8">
              <div className="max-w-4xl mx-auto">
                {messages.length === 0 ? (
                  <div className="py-12 flex flex-col items-center text-center">
                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-3xl shadow-xl shadow-indigo-500/20 mb-4 animate-bounce">
                      ✨
                    </div>
                    <h2 className="text-xl font-bold text-white mb-2">How can I assist you today?</h2>
                    <p className="text-sm text-slate-400 max-w-md mb-8">
                      Grounded document RAG, multimodal vision, real-time web search synthesis, and Word (.docx) document generation.
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl text-left">
                      {[
                        { icon: '🎨', title: 'Free AI Image Generator', p: 'Generate an image of a futuristic electric supercar glowing in neon city rain.' },
                        { icon: '📷', title: 'Web Photo Search', p: 'Show me a photo of Taj Mahal in Agra.' },
                        { icon: '📄', title: 'Document RAG & Summary', p: 'Summarize the key findings and details in my uploaded document.' },
                        { icon: '🌐', title: 'Web Research Synthesis', p: 'What are the latest developments and breakthrough models in AI today?' },
                        { icon: '📝', title: 'Create Word Report', p: 'Create a report on Artificial Intelligence with introduction, applications and conclusion.' },
                        { icon: '🖼️', title: 'Image OCR & Question Solve', p: 'Read this question from the image and solve it step-by-step.' }
                      ].map((item, i) => (
                        <div key={i} onClick={() => handleSendMessage(item.p)} className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 hover:border-indigo-500/60 hover:bg-slate-800/80 cursor-pointer transition shadow-sm group">
                          <div className="text-2xl mb-1.5">{item.icon}</div>
                          <div className="text-xs font-semibold text-slate-200 group-hover:text-indigo-300">{item.title}</div>
                          <div className="text-[11px] text-slate-400 mt-0.5 line-clamp-2">{item.p}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  messages.map(m => {
                    const isUser = m.role === 'user';
                    let meta = m.metadata || {};
                    if (typeof m.metadata_json === 'string' && m.metadata_json) {
                      try { meta = { ...meta, ...JSON.parse(m.metadata_json) }; } catch(e){}
                    }
                    const qType = meta.query_type;
                    const sources = meta.sources || [];
                    const doc = meta.created_document;

                    return (
                      <div key={m.id} className={`flex w-full ${isUser ? 'justify-end' : 'justify-start'} my-3`}>
                        <div className={`max-w-[85%] md:max-w-[75%] rounded-2xl px-4 py-3.5 shadow-sm ${isUser ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-bl-none'}`}>
                          {qType && !isUser && (
                            <div className="mb-2">
                              <span className={`inline-flex items-center text-[10px] font-semibold px-2 py-0.5 rounded-full border ${
                                qType === 'image_generation' ? 'bg-fuchsia-950 text-fuchsia-300 border-fuchsia-800' :
                                qType === 'web_image_search' ? 'bg-teal-950 text-teal-300 border-teal-800' :
                                qType === 'rag' ? 'bg-emerald-950 text-emerald-300 border-emerald-800' :
                                qType === 'web_search' ? 'bg-blue-950 text-blue-300 border-blue-800' :
                                qType === 'document_creation' ? 'bg-amber-950 text-amber-300 border-amber-800' :
                                qType === 'document_update' ? 'bg-cyan-950 text-cyan-300 border-cyan-800' :
                                qType === 'hybrid' ? 'bg-purple-950 text-purple-300 border-purple-800' :
                                'bg-slate-800 text-slate-300 border-slate-700'
                              }`}>
                                {qType === 'image_generation' ? '🎨 AI Image Generated' :
                                 qType === 'web_image_search' ? '📷 Web Image Result' :
                                 qType === 'rag' ? '📄 Document RAG Grounding' :
                                 qType === 'web_search' ? '🌐 Web Search Grounded' :
                                 qType === 'document_creation' ? '📝 Document Created' :
                                 qType === 'document_update' ? '🔄 Document Updated' :
                                 qType === 'hybrid' ? '⚡ RAG + Web Synthesis' : '🤖 Assistant'}
                              </span>
                            </div>
                          )}

                          <FormattedContent content={m.content} />

                          {doc && (
                            <div className="mt-3 p-3 bg-slate-950 border border-emerald-800/80 rounded-xl flex items-center justify-between gap-3">
                              <div className="flex items-center gap-2 truncate">
                                <span className="text-2xl">📑</span>
                                <div className="truncate">
                                  <div className="font-medium text-xs text-white truncate">{doc.filename}</div>
                                  <div className="text-[10px] text-emerald-400">Microsoft Word (.docx)</div>
                                </div>
                              </div>
                              <a href={doc.download_url} download target="_blank" rel="noreferrer" className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium transition shadow">
                                ⬇️ Download
                              </a>
                            </div>
                          )}

                          {sources && sources.length > 0 && (
                            <details className="mt-3 border-t border-slate-800 pt-2 text-xs">
                              <summary className="text-slate-400 hover:text-indigo-300 font-medium cursor-pointer">
                                Cited Sources & Grounding ({sources.length})
                              </summary>
                              <div className="mt-2 space-y-1.5">
                                {sources.map((s, idx) => (
                                  <div key={idx} className="p-2 rounded bg-slate-950 border border-slate-800 text-[11px] text-slate-300">
                                    <div className="flex justify-between font-medium text-slate-200">
                                      <span>{s.type === 'document' ? '📄 ' : '🌐 '}{s.title}</span>
                                      {s.score && <span className="text-emerald-400 font-mono">match: {Math.round(s.score * 100)}%</span>}
                                    </div>
                                    {s.url && <a href={s.url} target="_blank" rel="noreferrer" className="text-indigo-400 hover:underline block truncate text-[10px]">{s.url}</a>}
                                    {s.snippet && <p className="text-slate-400 mt-1 italic line-clamp-2">"{s.snippet}"</p>}
                                  </div>
                                ))}
                              </div>
                            </details>
                          )}

                          <div className="mt-2 pt-1 flex items-center justify-between text-[10px] text-slate-400">
                            <span>{m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'now'}</span>
                            {!isUser && (
                              <button onClick={() => handleTTS(m.content)} className="hover:text-indigo-300 text-slate-400">
                                {speaking ? '🔊 Speaking...' : '🔈 Read Aloud'}
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}

                {isLoading && (
                  <div className="flex justify-start my-3">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 flex items-center gap-3 text-slate-300 text-xs shadow-sm">
                      <span className="w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin" />
                      <span>Synthesizing multimodal response & retrieving sources...</span>
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>
            </div>

            {/* Input Controls */}
            <div className="border-t border-slate-800 bg-slate-900/90 backdrop-blur-md p-3 sm:p-4">
              <div className="max-w-4xl mx-auto space-y-2">
                {attachedFiles.length > 0 && (
                  <div className="flex flex-wrap gap-2 pb-1">
                    {attachedFiles.map((f, i) => (
                      <div key={i} className="flex items-center gap-2 bg-slate-800 border border-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-xl">
                        {f.previewUrl ? <img src={f.previewUrl} className="w-5 h-5 object-cover rounded" /> : <span>📄</span>}
                        <span className="max-w-[140px] truncate">{f.name}</span>
                        <button onClick={() => setAttachedFiles(attachedFiles.filter((_, idx) => idx !== i))} className="text-slate-400 hover:text-red-400 font-bold">✕</button>
                      </div>
                    ))}
                  </div>
                )}

                <div className="flex items-center gap-2 text-xs">
                  <button onClick={() => setWebSearchOn(!webSearchOn)} className={`flex items-center gap-1 px-2.5 py-1 rounded-lg border text-xs font-medium transition ${webSearchOn ? 'bg-blue-600/30 border-blue-500 text-blue-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                    🌐 Web Search {webSearchOn ? 'ON' : 'Auto'}
                  </button>
                  <button onClick={() => setRagOn(!ragOn)} className={`flex items-center gap-1 px-2.5 py-1 rounded-lg border text-xs font-medium transition ${ragOn ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                    📄 RAG Grounding {ragOn ? 'ON' : 'Auto'}
                  </button>
                </div>

                <div className="flex items-end gap-2 bg-slate-950 border border-slate-800 rounded-2xl p-2 focus-within:border-indigo-500 transition">
                  <input ref={fileInputRef} type="file" multiple accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp" className="hidden" onChange={handleFileUpload} />
                  <button onClick={() => fileInputRef.current?.click()} title="Attach PDF, DOCX, TXT, or Image" className="p-2 text-slate-400 hover:text-indigo-400 rounded-xl transition">📎</button>
                  <button onClick={toggleSTT} title="Speech-to-Text Voice Input" className={`p-2 rounded-xl transition ${isListening ? 'bg-red-500/20 text-red-400 animate-pulse' : 'text-slate-400 hover:text-indigo-400'}`}>🎤</button>
                  <textarea
                    ref={textareaRef}
                    rows={1}
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }}
                    placeholder="Type a message, ask about uploaded docs, or type 'Create a report on AI'..."
                    className="flex-1 bg-transparent border-0 outline-none resize-none text-slate-100 placeholder-slate-500 text-sm py-1.5 px-2 max-h-40 leading-relaxed"
                  />
                  <button
                    onClick={() => handleSendMessage()}
                    disabled={(!inputText.trim() && attachedFiles.length === 0) || isLoading}
                    className={`p-2.5 rounded-xl font-medium transition flex items-center justify-center ${(!inputText.trim() && attachedFiles.length === 0) || isLoading ? 'bg-slate-800 text-slate-600' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow'}`}
                  >
                    ➤
                  </button>
                </div>
              </div>
            </div>
          </main>

          {/* Document Create/Update Modal */}
          {docModalOpen && (
            <DocModalComponent
              onClose={() => setDocModalOpen(false)}
              documents={documents}
              conversationId={activeConvId}
              onSuccess={(d) => setDocuments([d, ...documents])}
            />
          )}
        </div>
      );
    }

    function DocModalComponent({ onClose, documents, conversationId, onSuccess }) {
      const [tab, setTab] = useState('create');
      const [title, setTitle] = useState('');
      const [instructions, setInstructions] = useState('');
      const [docId, setDocId] = useState('');
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          let res;
          if (tab === 'create') {
            res = await API.createDocument(title, instructions, conversationId);
          } else {
            res = await API.updateDocument(docId, instructions, conversationId);
          }
          setResult(res);
          onSuccess(res);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div className="p-4 border-b border-slate-800 flex justify-between items-center">
              <h3 className="font-semibold text-white text-sm flex items-center gap-2"><span>📄</span> Document Assistant</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>
            <div className="flex border-b border-slate-800 bg-slate-950/50">
              <button onClick={() => { setTab('create'); setResult(null); }} className={`flex-1 py-2 text-xs font-medium border-b-2 transition ${tab === 'create' ? 'border-indigo-500 text-indigo-400 font-semibold' : 'border-transparent text-slate-400'}`}>
                ➕ Create New Document
              </button>
              <button onClick={() => { setTab('update'); setResult(null); }} className={`flex-1 py-2 text-xs font-medium border-b-2 transition ${tab === 'update' ? 'border-indigo-500 text-indigo-400 font-semibold' : 'border-transparent text-slate-400'}`}>
                🔄 Modify Existing Document
              </button>
            </div>
            <div className="p-5 space-y-4">
              {error && <div className="p-3 bg-red-950/60 border border-red-800 text-red-300 text-xs rounded-xl">{error}</div>}
              {result && (
                <div className="p-3 bg-emerald-950/60 border border-emerald-800 text-emerald-300 text-xs rounded-xl space-y-2">
                  <div className="font-semibold">✅ {result.message}</div>
                  <a href={result.download_url} download className="inline-block px-3 py-1 bg-emerald-600 text-white rounded font-medium">⬇️ Download {result.filename}</a>
                </div>
              )}
              <form onSubmit={handleSubmit} className="space-y-3">
                {tab === 'create' ? (
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Document Title</label>
                    <input required placeholder="e.g. AI Strategy Brief 2026" value={title} onChange={e => setTitle(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
                  </div>
                ) : (
                  <div>
                    <label className="block text-xs text-slate-300 mb-1">Select Document to Modify</label>
                    <select required value={docId} onChange={e => setDocId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                      <option value="">-- Choose document --</option>
                      {documents.map(d => <option key={d.id} value={d.id}>{d.filename}</option>)}
                    </select>
                  </div>
                )}
                <div>
                  <label className="block text-xs text-slate-300 mb-1">Instructions</label>
                  <textarea required rows={4} placeholder="e.g. Include introduction, key challenges, and conclusion." value={instructions} onChange={e => setInstructions(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white resize-none focus:outline-none focus:border-indigo-500" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium">Cancel</button>
                  <button type="submit" disabled={loading} className="px-4 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-medium">{loading ? 'Processing...' : tab === 'create' ? 'Generate (.docx)' : 'Update & Save'}</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
